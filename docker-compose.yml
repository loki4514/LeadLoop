services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: leadagent
      POSTGRES_PASSWORD: leadagent
      POSTGRES_DB: leadagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-LeadLoop <onboarding@resend.dev>}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # NOTE: OPENAI_BASE_URL is intentionally NOT listed here. The openai SDK
      # reads OPENAI_BASE_URL straight from the environment; injecting an empty
      # value makes the SDK use "" as the endpoint and every request fails with
      # UnsupportedProtocol. To use a custom endpoint, add it back with a real
      # value (or export it on the host).
      UPLOAD_DIR: /data/uploads
      # Blank in .env = uploads stay on the shared uploads_data volume. Set them
      # to point at R2/S3 instead (also lets you test object storage locally).
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_PREFIX: ${S3_PREFIX:-uploads/}
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # Dev: talk to the backend directly on the host-published port.
      args:
        NEXT_PUBLIC_API_BASE: "http://localhost:8000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - backend

  worker:
    # Build from the backend context so the worker shares the same app package
    # (ingestion, embeddings, models, DB session) — single source of truth.
    build: ./backend
    # -B embeds the beat scheduler (periodic stall-checker) in the same process.
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "-B", "--loglevel=info", "--concurrency=2"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIM: ${EMBEDDING_DIM}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_MODEL: ${LLM_MODEL}
      LLM_API_KEY: ${LLM_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Follow-up automation (LLM drafts + employee notification emails)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-LeadLoop <onboarding@resend.dev>}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      STALL_HOURS: ${STALL_HOURS:-48}
      FOLLOWUP_CHECK_MINUTES: ${FOLLOWUP_CHECK_MINUTES:-60}
      # See the backend service: OPENAI_BASE_URL is intentionally omitted so an
      # empty value can't override the openai SDK's default endpoint.
      UPLOAD_DIR: /data/uploads
      # Blank in .env = uploads stay on the shared uploads_data volume. Set them
      # to point at R2/S3 instead (also lets you test object storage locally).
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_PREFIX: ${S3_PREFIX:-uploads/}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
